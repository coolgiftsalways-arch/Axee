    <!-- UNBOUND BRAND TITLE -->

    <!-- UNBOUND FAVICON -->
 <link rel="icon" type="image/jpeg" href="/Logo.jpg" />

    <!-- THEME COLOR -->
    <meta name="theme-color" content="#000000" />

    <!-- GOOGLE TAG MANAGER -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-TJHZ2LH6");
    </script>
    <!-- END GOOGLE TAG MANAGER -->

    <!-- TRACKING HELPERS (send events to GTM) -->
    <script>
      // Called by the React app when a product is added to the cart
      window.trackAddToCartConversion = function (orderValue = 1.0) {
        const value = Number(orderValue);
        window.dataLayer.push({
          event: "add_to_cart",
          value: Number.isFinite(value) ? value : 1.0,
          currency: "INR"
        });
      };

      // Called by the React app on the order success page
      window.trackPurchaseConversion = function (transactionId, orderValue) {
        if (!transactionId || !Number.isFinite(Number(orderValue))) {
          console.error("Invalid purchase conversion data");
          return;
        }
        window.dataLayer.push({
          event: "purchase",
          value: Number(orderValue),
          currency: "INR",
          transaction_id: String(transactionId)
        });
      };
    </script>
  </head>
